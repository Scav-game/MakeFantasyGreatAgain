name: Sync ESPN Rosters

on:
  # Fires every 3 minutes (GitHub's finest supported granularity); the
  # "gate" job below restricts actual work to the real target cadence —
  # see its "Check time window" step.
  schedule:
    - cron: "*/3 * * * *"
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      in_window: ${{ steps.window.outputs.in_window }}
    steps:
      - name: Check time window (Eastern time)
        id: window
        run: |
          # Computed live in America/New_York so this self-adjusts for
          # Daylight Saving without needing the cron schedule touched twice
          # a year.
          #   8:00 AM - 8:57 PM  -> every 3 min  (matches the cron cadence)
          #   9:00 PM - 11:30 PM -> every 30 min (minute is :00 or :30)
          #   Midnight (00:00)   -> one final check
          #   12:30 AM - 7:57 AM -> nothing
          hour=$(TZ='America/New_York' date +%H)
          minute=$(TZ='America/New_York' date +%M)

          in_window=false
          if [ "$hour" -ge 8 ] && [ "$hour" -le 20 ]; then
            in_window=true
          elif [ "$hour" -ge 21 ] && [ "$hour" -le 23 ] && { [ "$minute" = "00" ] || [ "$minute" = "30" ]; }; then
            in_window=true
          elif [ "$hour" -eq 0 ] && [ "$minute" = "00" ]; then
            in_window=true
          fi

          echo "in_window=$in_window" >> "$GITHUB_OUTPUT"

  sync:
    needs: gate
    if: needs.gate.outputs.in_window == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Runs before sync-espn.js on purpose: it needs the *previous* run's
      # last-sync.json as a bootstrap cutoff before that file potentially
      # gets overwritten below. After the first run it tracks its own cursor
      # in transaction-log.json regardless of this ordering.
      - name: Check for new transactions (Jake's tweets)
        run: node scripts/check-transactions.js

      - name: Sync rosters from ESPN
        run: node scripts/sync-espn.js

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updates
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "mfga-bot@users.noreply.github.com"
          git config --local user.name "MFGA Roster Bot"
          git add data/rosters.csv data/news.csv last-sync.json transaction-log.json
          git commit -m "Auto-sync rosters from ESPN $(date +%Y-%m-%d)"
          git push
