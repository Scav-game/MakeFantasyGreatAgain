name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      send_latest_news_email:
        description: "Also email the single most recent news.csv story (bypasses the new-since-last-push check)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

  send-email:
    needs: build
    if: github.event_name == 'push' || github.event.inputs.send_latest_news_email == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send news email if new articles were added
        env:
          # The GitHub secret is still named RESEND_API_KEY from the original
          # Resend attempt (then held a SendGrid key, now a Brevo key).
          # Renamed here rather than making Lucas recreate the secret each
          # time the provider changes — API keys generally aren't
          # re-viewable after creation.
          BREVO_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_RECIPIENTS: ${{ vars.EMAIL_RECIPIENTS }}
          BEFORE_SHA: ${{ github.event.before }}
          SEND_LATEST_ONLY: ${{ github.event.inputs.send_latest_news_email }}
        run: node scripts/send-news-email.js
